/* Look: a drawing sheet on a table. Day is soft cream paper (not white, so it does not glare); night is the same sheet in dark paper with light ink,
   on every screen alike. Settings choose day, night or the phone's own setting (default). Shantell Sans everywhere: hand-made but easy to read. */
:root{
  --hand:"Shantell Sans","Segoe UI",system-ui,sans-serif; --body:var(--hand); --stamp:var(--hand); --script:var(--hand); --edge:#2d2a55; --onc:#2d2a55;
  --ink:#2d2a55; --ink2:#6b6892; --line:#2d2a55; --card:#fff; --sh:rgba(45,42,85,.22); --faint:rgba(45,42,85,.28);
  --c1:#ff5f4d; --c1s:#c9301f; --c2:#ffcb1f; --c2s:#d19c00; --c3:#27cf92; --c3s:#119868; --c4:#4aa8ff; --c4s:#1f74d6; --c5:#a07bff; --c5s:#6f46d9;
  --bgA:#e6dece; --bgB:#e6dece; --paper:#eee7d6; --pline:rgba(45,42,85,.07); --wBrown:#8b5a2b; --wBlue:#2b6bd6; --wGrey:#8a9099; --wYG:#2e9e48; --nA:#1b1c22; --nB:#1b1c22;
  --fg:#2d2a55; --fg2:rgba(45,42,85,.55);
  --hdr:#e4dbc6; --hdrl:#cdc2a6; --hdrt:#6d6552; --board:#efe8d8; --dot:rgba(45,42,85,.2); --woff:#fff; --wob:#2d2a55; --loff:#fff; --brown:#c8793a; --blue:#4f8be6;
  --red:#e5484d; --lamp:#ffcb1f; --scrim:rgba(30,20,70,.58);
  color-scheme:light;
}
body.night{color-scheme:dark;--ink:#e9e2cf;--ink2:#a59f8e;--line:#e9e2cf;--fg:#e9e2cf;--fg2:rgba(233,226,207,.6);--faint:rgba(233,226,207,.24);--sh:rgba(0,0,0,.4);--edge:#0c0d11;
  --paper:#272932;--pline:rgba(233,226,207,.05);--board:#24262e;--hdr:#2c2e38;--hdrl:#3e414e;--hdrt:#a59f8e;--dot:rgba(233,226,207,.07);--woff:#a59f8e;--wob:#101116;--loff:#4a4d5a;
  --red:#ff6b6b;--c1s:#ff8a7a;--c3s:#4fd6a2;--wBrown:#c08850;--scrim:rgba(0,0,0,.6)}
/* things with a coloured face (yellow buttons, the selected chip) keep dark ink at night */
body.night .power.on{--ink:#2d2a55;--line:#2d2a55;color:#2d2a55}
body.night .learn{background:#3b3624}
body.night .wo{stroke:#4a4d59}body.night .st-ok{fill:#5be0a8}body.night .st-bad{fill:#ff8a7a}
.cadbar,.cadstat{display:none!important}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;color:var(--fg);font-family:var(--body);font-weight:500;overflow:hidden;-webkit-tap-highlight-color:transparent;position:relative;background:linear-gradient(var(--bgA),var(--bgB)) fixed}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(var(--nA),var(--nB));opacity:0;transition:opacity .7s ease;z-index:-1;pointer-events:none}
body.night::before{opacity:1}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.app{height:100%;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.frame{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:9px}
.hl{display:inline}.u2{display:none}
.lab{font:700 12px var(--hand);letter-spacing:.02em;color:var(--ink2)}
.red{color:var(--red)}
.up{text-transform:uppercase}

/* shared pieces */
.round{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--sh);display:grid;place-items:center;padding:0;position:relative}
.round:active,.btn:active,.tile:active,.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.round svg{width:22px;height:22px;display:block}
.round.big{width:54px;height:54px}.round.big svg{width:28px;height:28px}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--sh);display:inline-flex;align-items:center;gap:5px;padding:3px 13px 3px 7px;font:800 15px var(--hand);color:var(--ink);min-height:36px;white-space:nowrap}
.pill svg{width:20px;height:20px;flex:none}
.badge{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--c1);border:3px solid var(--line)}
.btn{border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--sh);min-height:46px;padding:0 14px;font:700 15px var(--hand);letter-spacing:0;text-transform:none}
.btn:disabled{opacity:.45}
.btn.sq{padding:0;width:46px;flex:none}

/* home: a drawing sheet with a classic menu. Logo on top, one yellow play button, then the other ways in. The level lamps live on the Paftalar screen. */
.home.sheetH{background:var(--paper);background-image:linear-gradient(var(--pline) 1px,transparent 1px),linear-gradient(90deg,var(--pline) 1px,transparent 1px);background-size:20px 20px;border:2.5px solid var(--ink);border-radius:4px;padding:22px 12px 12px 28px;gap:12px;overflow-y:auto;overflow-x:hidden}
.zone{position:absolute;display:flex;font:700 10px var(--hand);color:var(--ink2);pointer-events:none}
.zone i{flex:1;font-style:normal;display:grid;place-items:center;border-color:var(--faint);border-style:solid;border-width:0}
.zt{left:20px;right:0;top:0;height:16px;border-bottom:1.5px solid var(--faint)}.zt i{border-left-width:1.5px}.zt i:first-child{border-left-width:0}
.zl{top:16px;bottom:0;left:0;width:18px;flex-direction:column;border-right:1.5px solid var(--faint)}.zl i{border-top-width:1.5px}.zl i:first-child{border-top-width:0}
.htop2{display:flex;justify-content:flex-end}
.ib{width:46px;height:46px;flex:none;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);display:grid;place-items:center;padding:0;position:relative}
.ib svg{width:24px;height:24px}
.ib:active{transform:translateY(2px)}
.hlogo2{display:none;flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink)}
.hlogo2 svg{width:min(150px,40vw);height:auto;display:block;overflow:visible}
.hlogo2 h1{margin:6px 0 0;font:800 clamp(30px,10.5vw,46px)/1 var(--hand);letter-spacing:-.01em;white-space:nowrap}
.hlogo2 h1 em{font-style:normal;color:var(--wBrown)}
.hlogo2 p{margin:6px 0 0;font:700 11px var(--hand);letter-spacing:.14em;color:var(--ink2)}
.hmenu{display:flex;flex-direction:column;gap:10px}
/* the house on the home screen: one room per group of sheets, lit when they are all approved */
.htop2{align-items:flex-start;justify-content:space-between;gap:10px}
.hname{color:var(--ink);min-width:0;padding-top:2px}
.hname h1{margin:0;font:800 clamp(26px,8.4vw,36px)/1 var(--hand);white-space:nowrap}
.hname h1 em{font-style:normal;color:var(--wBrown)}
.hname p{margin:4px 0 0;font:700 10px var(--hand);letter-spacing:.14em;color:var(--ink2)}
.house{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;padding:0;color:var(--ink);cursor:pointer}
.house svg{width:100%;max-height:min(40vh,250px);display:block;overflow:visible}
.house small{font:700 12px var(--hand);color:var(--ink2)}
.hs{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.hr{fill:none;stroke:var(--ink);stroke-width:1.1;opacity:.55}
.hr.todo{stroke-dasharray:3 3;opacity:.35}
.hfill{fill:var(--c2);opacity:0;transition:opacity .6s}
.hu.lit .hfill{opacity:.34}
.hu.lit.newlit .hfill{animation:roomOn 1.6s ease-out}
@keyframes roomOn{0%{opacity:0}15%{opacity:.75}30%{opacity:.2}45%{opacity:.7}100%{opacity:.34}}
.hb{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.hu.todo .hb{stroke:var(--faint)}
.hu.lit .hb{fill:var(--c2)}
.hglow{opacity:0;pointer-events:none}.hu.lit .hglow{opacity:1}
.hu.nx .hb{animation:nxt 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;stroke:var(--c2s);stroke-width:2.2}
.hd{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.7}
.hm{font:700 7px var(--hand);fill:var(--ink);opacity:.7}
.playbar{display:flex;align-items:center;gap:12px;width:100%;min-height:70px;border:2.5px solid var(--ink);border-radius:12px;background:var(--c2);box-shadow:0 5px 0 var(--edge);padding:6px 16px;text-align:left;color:var(--ink)}
.playbar:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.playbar svg{width:30px;height:30px;flex:none}
.playbar svg *{fill:currentColor;stroke:currentColor}
.playbar b{display:block;font:800 26px/1.05 var(--hand)}
.playbar span{display:block;font:600 13px/1.25 var(--hand);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playbar .pt{flex:1;min-width:0}
.mitem{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--edge);padding:4px 14px;text-align:left;color:var(--ink);position:relative}
.mitem:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.mitem>svg{width:26px;height:26px;flex:none}
.mitem b{flex:1;min-width:0;font:700 18px/1.1 var(--hand)}
.mitem small{font:600 12.5px var(--hand);color:var(--ink2);white-space:nowrap}
.mitem.off{opacity:.55}
.mitem .badge{right:-6px;top:-6px}
.tblock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2.5px solid var(--ink);background:var(--paper);font-family:var(--hand)}
.tblock>div,.tblock>button{border:0 solid var(--ink);border-left-width:1.5px;padding:4px 8px 5px;min-width:0;background:none;color:var(--ink);text-align:left}
.tblock>div:first-child{border-left-width:0}
.tblock .tl{display:block;font:700 9.5px var(--hand);color:var(--ink2);letter-spacing:.08em}
.tblock .tv{display:flex;align-items:center;gap:4px;font:800 16px var(--hand);color:var(--ink);white-space:nowrap}
.tblock .tv svg{width:17px;height:17px;flex:none}

/* paftalar */
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;min-width:0;margin:0;font:800 17px var(--hand);color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.2}
/* the level list: every chapter is one circuit, a meter and a lamp per level. It scrolls with a finger (and with a mouse drag on a computer). */
.lvwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding:4px 2px 18px;touch-action:pan-y;cursor:grab}
.lvwrap.dragging{cursor:grabbing}
.chapcard{border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);background-image:linear-gradient(var(--pline) 1px,transparent 1px),linear-gradient(90deg,var(--pline) 1px,transparent 1px);background-size:20px 20px;box-shadow:0 3px 0 var(--edge);padding:10px 8px 4px}
.chaphd{display:flex;align-items:baseline;gap:8px;padding:0 6px}
.chaphd small{display:block;font:700 11px var(--hand);color:var(--ink2);letter-spacing:.06em}
.chaphd b{display:block;font:800 20px/1.1 var(--hand);color:var(--ink)}
.chaphd .cs{margin-left:auto;display:flex;align-items:center;gap:3px;font:800 14px var(--hand);color:var(--ink);white-space:nowrap}
.chaphd .cs svg{width:16px;height:16px}
.chapcard svg.map{display:block;width:100%;height:auto}
.cmap .lp{cursor:pointer}
.cmap .lp:active{transform-box:fill-box;transform-origin:center;transform:scale(.92)}
.cmap .nxt{animation:nxt 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nxt{50%{transform:scale(1.18);opacity:.45}}
.soon{align-self:center;border:2.5px dashed var(--faint);border-radius:8px;padding:5px 14px;font:700 13px var(--hand);color:var(--fg2)}
#levelScr .round,#levelScr .pill{box-shadow:none;border-width:2.5px;background:var(--paper);border-radius:12px}
@keyframes pls{50%{transform:scale(1.18)}}

/* game */
.order{background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--sh);display:grid;grid-template-columns:minmax(0,1fr) auto;overflow:hidden}
.order .say{padding:7px 11px;min-width:0}
.order p{margin:2px 0 0;font:500 14px/1.35 var(--body)}
.order ul{margin:6px 0 2px;padding:6px 0 0 18px;font:500 13px/1.4 var(--body);border-top:2px dashed var(--faint)}
.hintbtn{border:0;border-left:1.5px dashed var(--faint);background:transparent;color:var(--ink2);padding:0 8px;font:700 10.5px var(--hand);min-width:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:0}
.hintbtn svg{width:20px;height:20px}
.hintbtn small{font:700 9.5px var(--hand);color:var(--ink2)}
.hintbtn small{display:flex;align-items:center;gap:2px}.hintbtn small svg{width:9px;height:9px}
.sheet{flex:1;min-height:0;position:relative;overflow:hidden;border:3px solid var(--line);border-radius:18px;background:var(--board);box-shadow:0 5px 0 var(--sh);transition:background .6s ease}
.sheet svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet.shake{animation:shake .4s}
.coach{position:absolute;left:8px;right:56px;bottom:8px;z-index:2;background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--sh);padding:8px 32px 8px 11px;font:500 14px/1.35 var(--body);animation:toastin .25s ease-out}
.coach b{font-weight:800;color:var(--c1s)}
.coach button{position:absolute;right:3px;top:3px;width:28px;height:28px;border:0;background:none;font-size:20px;line-height:1;color:var(--ink2);padding:0}
.readout{position:absolute;right:8px;top:26px;width:min(158px,46%);background:#ffffffee;color:var(--ink);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--sh);padding:6px 8px 8px;pointer-events:none;z-index:2}
.readout svg{display:block;width:100%;height:auto}
.readout .dnote{font:500 12px/1.3 var(--body);margin-top:4px}
.zh,.zv{position:absolute;pointer-events:none;z-index:1;background:var(--hdr);color:var(--hdrt);font:700 11px/1 var(--hand)}
.zh{left:0;right:0;top:0;height:18px;border-bottom:1.5px solid var(--hdrl)}
.zh::before{content:"";position:absolute;left:0;top:0;width:18px;height:18px;background:var(--hdr);border-right:1.5px solid var(--hdrl)}
.zv{left:0;top:18px;bottom:0;width:18px;border-right:1.5px solid var(--hdrl)}
.zh span,.zv span{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden}
.zh span{top:0;height:100%;border-left:1.5px solid var(--hdrl)}
.zv span{left:0;width:100%;border-top:1.5px solid var(--hdrl)}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px}
.tool svg{width:46px;height:46px}
.tool[aria-pressed="true"]{background:var(--c2)}
.zoomctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomctl button{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink);font:800 20px/1 var(--hand);padding:0;display:grid;place-items:center;box-shadow:0 3px 0 var(--sh)}
.fstamp{position:absolute;left:50%;top:38%;z-index:3;pointer-events:none;text-align:center;font-family:var(--stamp);color:var(--red);transform:translate(-50%,-50%) rotate(-7deg);animation:fstamp 2.4s ease-out forwards}
.fstamp .a{display:inline-block;border:4px solid var(--red);border-radius:16px;padding:3px 16px;font-size:30px;font-weight:700;letter-spacing:2px;background:#fff;box-shadow:0 6px 0 var(--sh)}
.fstamp .b{display:block;margin-top:8px;font:500 14px var(--body);color:var(--ink);background:#fff;padding:3px 8px;border-radius:10px;max-width:260px}
@keyframes fstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(1.9)}9%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}78%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:rgba(255,60,40,.4);pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{to{opacity:0}}
.status{font:800 12.5px var(--hand);color:var(--fg);display:flex;justify-content:space-between;gap:10px;min-height:18px;padding:0 4px}
.status span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status span:last-child{flex:none}
.dock{background:#ffffffe8;border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--sh);padding:8px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:3px solid var(--line);background:#fff;border-radius:12px;font:800 13px var(--hand);color:var(--ink2);padding:4px 2px;box-shadow:0 3px 0 var(--sh)}
.tabs button.on{background:var(--c4);color:#fff}
.pal{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 6px}
.pcard{position:relative;flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--sh);padding:5px 3px 4px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;font:800 10px/1.15 var(--hand);color:var(--ink);text-align:center}
.pcard.done{opacity:.4}
.picon{width:52px;height:46px;flex:none}
.picon text{display:none}
.pname{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pcard .pc{display:block;font:600 9px var(--body);color:var(--ink2)}
.pq{position:absolute;right:-7px;top:-7px;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);background:var(--c2);color:var(--ink);font:800 12px/1 var(--hand);padding:0;display:grid;place-items:center}
.colors{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 5px}
.chip{flex:1;min-width:60px;border:3px solid var(--line);background:#fff;border-radius:12px;padding:5px 2px 5px;font:800 11px var(--hand);color:var(--ink);box-shadow:0 3px 0 var(--sh);text-transform:none}
.chip i{display:block;height:11px;border-radius:6px;border:2px solid var(--line);margin:0 6px 4px}
.chip[aria-pressed="true"]{background:var(--c2)}
.tools{display:flex;gap:6px}
.tool{flex:1;border:3px solid var(--line);background:#fff;border-radius:12px;padding:6px;font:800 13px var(--hand);color:var(--ink);box-shadow:0 3px 0 var(--sh)}
.tool small{display:block;font:600 10px var(--body);color:var(--ink2);margin-top:2px}
.ctl{display:flex;gap:8px;align-items:center}
.edits{display:flex;gap:6px}
.edits .btn{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center}
.edits .btn svg{width:22px;height:22px}
.acts{flex:1;display:flex;gap:8px;min-width:0}
.power{flex:1;min-width:0;height:50px;border-radius:25px;background:var(--c1);border:3px solid var(--line);box-shadow:0 6px 0 0 var(--c1s),0 6px 0 3px var(--line);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;padding:0;margin-bottom:6px;font:800 14px var(--hand);position:relative}
.power svg{width:28px;height:28px}
.power.on{background:var(--c2);color:var(--ink);box-shadow:0 6px 0 0 var(--c2s),0 6px 0 3px var(--line)}
.power:not(.on)::after{content:"";position:absolute;inset:-7px;border-radius:32px;border:3px solid var(--c1);opacity:.5;animation:ring 1.4s ease-out infinite;pointer-events:none}
.acts .ok{flex:none;width:56px;height:50px;border-radius:25px;background:var(--c3);color:#fff;border:3px solid var(--line);box-shadow:0 6px 0 0 var(--c3s),0 6px 0 3px var(--line);display:grid;place-items:center;padding:0;margin-bottom:6px;min-height:0}
.acts .ok svg{width:26px;height:26px}
.acts.free .ok{display:none}
@keyframes ring{from{transform:scale(.94);opacity:.8}to{transform:scale(1.12);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;max-width:min(92vw,420px);width:max-content;background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--sh);padding:8px 14px;font:600 14px/1.35 var(--body);text-align:center;z-index:30;pointer-events:none;animation:toastin .2s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}}

/* svg drawing */
.sheet svg text{font-family:var(--hand);letter-spacing:-.03em}
.gl{display:none}.gd{display:block;fill:var(--dot)}
.zone{font-size:9px;fill:var(--fg2)}
.ztick{stroke:var(--fg2);stroke-width:1}
.ink{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.dash{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.6;stroke-dasharray:3 3}
.post{fill:var(--ink)}
.boxsh{fill:var(--bs,#c9cfdc);stroke:var(--line);stroke-width:2.4;stroke-linejoin:round}
.box{fill:var(--b,#fff);stroke:var(--line);stroke-width:2.4;stroke-linejoin:round}
.hi{fill:#fff;opacity:.45}
.t-sayac,.t-buat2,.t-grid1,.t-grid3,.t-buat{--b:var(--c3);--bs:var(--c3s)}
.t-mcb,.t-mcb3,.t-rcd,.t-msw,.t-thermal,.t-contactor{--b:var(--c4);--bs:var(--c4s)}
.t-switch1,.t-komut,.t-vavien,.t-kruvaze,.t-buton,.t-stop,.t-start{--b:var(--c5);--bs:var(--c5s)}
.t-lamp,.t-socket,.t-motor3{--b:var(--c1);--bs:var(--c1s)}
.t-zil{--b:var(--c2);--bs:var(--c2s)}
.t-dolap{--b:#dfe3f2;--bs:#b3bad6}
.hatch{stroke:var(--line);stroke-opacity:.25;stroke-width:1.4}
.lbl{font-size:13px;font-weight:700;fill:var(--ink)}
.lblo{font-size:13px;font-weight:700;fill:var(--fg);paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round}
.sm{font-size:10.5px;font-weight:700;fill:var(--ink)}
.st-ok{fill:#0b6b45}.st-bad{fill:#a3231b}
.tripped{stroke:var(--red)!important}
.term{fill:#fff;stroke:var(--line);stroke-width:2.2}
.term.used{fill:var(--line)}
.slot{stroke:#fff;stroke-width:1.4}
.selring{fill:none;stroke:var(--c2);stroke-width:3;stroke-dasharray:4 4;animation:spinr 4s linear infinite;transform-box:fill-box;transform-origin:center}
.wmask{fill:none;stroke:var(--board);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.wo{fill:none;stroke:var(--wob);stroke-width:var(--wow,8);stroke-linecap:round;stroke-linejoin:round}
.wt{fill:none;stroke:var(--woff);stroke-width:var(--wcw,4.8);stroke-linecap:round;stroke-linejoin:round}
.wc{fill:none;stroke-width:var(--wcw,4.8);stroke-linecap:round;stroke-linejoin:round}
.wh{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.pend{fill:none;stroke:var(--c1);stroke-width:3.8;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round}
.wsel{fill:none;stroke:var(--c2);stroke-width:13;opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.wtag{font-size:9px;font-weight:700;fill:var(--fg);letter-spacing:.3px}
.wtagbg{fill:var(--board);opacity:.9}
.ring{fill:none;stroke-width:3}
.flow{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:1 12;stroke-linecap:round;animation:flow .7s linear infinite}
.bulbOn{fill:var(--c2)!important;stroke:var(--line)!important}
.bulbDim{fill:#ffe99a!important;stroke:var(--line)!important}
.xOn{stroke:#a06a00!important}
.flick{animation:flick .5s steps(1) 1}
.coilOn{fill:var(--c2)}
.capStop{fill:var(--c1)}.capStart{fill:var(--c3)}
.hum{animation:hum .09s linear infinite}
.led{fill:#fff;stroke:var(--line);stroke-width:1.4}.ledOn{fill:var(--c3);stroke:var(--line);stroke-width:1.4}
.spark{stroke:var(--c2);stroke-width:4;stroke-linecap:round;stroke-dasharray:30 60;stroke-dashoffset:30;animation:spark .55s ease-out forwards}
.pat{font-size:26px;font-weight:700;fill:var(--red);paint-order:stroke;stroke:#fff;stroke-width:5px;animation:fade 1.2s ease-out forwards}
.penOn{fill:var(--red);animation:fade 1.4s ease-out forwards}
.penOff{fill:none;stroke:var(--fg2);stroke-width:2.5;animation:fade 1.2s ease-out forwards}
.probe{stroke:var(--line);stroke-width:2}
.ghostbad{fill:rgba(229,72,77,.18);stroke:var(--red);stroke-width:2.4;stroke-dasharray:5 4}
.selbox{fill:none;stroke:var(--c2);stroke-width:2.6;stroke-dasharray:6 4}
.rotbtn circle{fill:#fff;stroke:var(--line);stroke-width:2.2}
.rotbtn path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.burst line{stroke:var(--c2);stroke-width:5;stroke-linecap:round}
.burst{transform-box:fill-box;transform-origin:center;animation:burst .9s ease-out forwards}
@keyframes wave{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.6);opacity:0}}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.2s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.3);opacity:1}60%{opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes flick{0%{opacity:1}20%{opacity:.1}40%{opacity:1}60%{opacity:.25}80%{opacity:1}}
@keyframes hum{25%{transform:translate(.8px,0)}75%{transform:translate(-.8px,0)}}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.4}100%{opacity:0;transform:translate(0,-30px) scale(1.6)}}
.smoke{fill:#8a8790;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 1.1s ease-out forwards;pointer-events:none}
.scorch{fill:#2b2420;opacity:.25;animation:fade 1.25s ease-out forwards;pointer-events:none}
@keyframes spark{to{stroke-dashoffset:-60;opacity:0}}
@keyframes fade{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.xhlab{display:none}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:20}
.mcard{background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line);position:relative;padding:18px 16px;max-width:400px;width:100%;max-height:100%;overflow-y:auto;animation:pop .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(14px) scale(.94);opacity:0}}
.mcard h2{font:800 22px/1.15 var(--hand);margin:3px 0 10px;letter-spacing:0;text-transform:none}
.mcard h2.bad{color:var(--red)}.mcard h2.good{color:var(--c3s)}
.mcard p{margin:0 0 12px;font:500 15px/1.5 var(--body)}
.mcard ul{margin:0 0 14px;padding-left:18px;font:500 14px/1.45 var(--body)}
.mcard ul li+li{margin-top:5px}
.mcard b{font-weight:800;background:linear-gradient(transparent 62%,#ffcb1f99 62%)}
.checks{list-style:none;padding:0!important;margin:0 0 14px!important}
.checks li{border:3px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.checks li+li{margin-top:6px!important}
.checks .why{display:block;font:500 12px var(--body);color:var(--red);margin-top:2px}
.checks .t{font:800 15px var(--hand)}
.checks .ok{color:var(--c3s);font-weight:800}
.mbtns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.mbtns .btn,.mbtns button{font:700 15px var(--hand);border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--sh);min-height:46px;text-transform:none;letter-spacing:0}
.mbtns .primary,.mbtns button.primary{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--c1s)}
.mbtns button:disabled{opacity:.45}
.mbtns.one{grid-auto-flow:row;margin-bottom:8px}
.bigstamp{width:190px;height:190px;margin:6px auto 16px;border-radius:50%;border:4px solid var(--line);background:var(--c1);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:0 8px 0 0 var(--c1s),0 8px 0 4px var(--line);font-family:var(--stamp);animation:stampin .4s cubic-bezier(.3,1.5,.5,1) both}
.bigstamp.small{width:140px;height:140px;background:var(--c5);box-shadow:0 8px 0 0 var(--c5s),0 8px 0 4px var(--line)}
.bigstamp .s1{font-size:11px;letter-spacing:2px;opacity:.9}
.bigstamp .s2{font-weight:700;font-size:26px;letter-spacing:1px;line-height:1.05;-webkit-text-stroke:2px var(--line);paint-order:stroke fill}
.bigstamp.small .s2{font-size:21px}
.bigstamp .s3{font-size:28px;letter-spacing:4px;color:var(--c2);-webkit-text-stroke:1.5px var(--line);paint-order:stroke fill}
.bigstamp .s4{font-size:11px;opacity:.9}
@keyframes stampin{from{transform:rotate(-6deg) scale(1.6);opacity:0}}
.learn{border:3px solid var(--line);background:#fff6cf;border-radius:14px;padding:8px 11px;margin-bottom:12px}
.learn p{margin:0;font:500 15px/1.5 var(--body)}
.reward{border:3px solid var(--line);border-radius:12px;padding:6px 8px;margin:0 0 10px!important;font-size:14px!important;line-height:1.4}
.daycard{display:flex;justify-content:space-between;gap:6px;border-top:3px dashed var(--faint);border-bottom:3px dashed var(--faint);padding:7px 2px;margin:0 0 10px;font:800 12px var(--hand);color:var(--ink2)}
.daycard b{display:block;color:var(--ink);font-size:17px;background:none}

  outro:'Both lamps glowed dimly. When you took one out, the other went off too, because electricity had only one path. This is called a series connection. Lamps in a house are not wired like this. On the next sheet you will do it right.'},
 7:{name:'Branching off',who:'Homeowner',
  say:'I want two lamps, both bright.',
  learn:'If each lamp has its own path, both shine brightly. This is called a parallel connection.',more:"If one fails, the other is not affected; houses are always wired this way. You don't have to go back to the meter: start dragging from the middle of an existing wire to branch off it. The joint shows as a thick dot.",
  hint:['Put the second lamp on the sheet.',"Start dragging from the middle of the first lamp's top wire and take it to the top end of the second lamp.",'Do the same with the bottom wire: branch off it and take it to the bottom end of the second lamp.']},
 8:{name:'The Neutral Zone',topic:'Live and neutral',who:'Homeowner',
  say:'We just moved in. A lamp on the ceiling, with its switch by the door.',
  learn:'The live (L) brings electricity, the neutral (N) takes it back. The live gives a shock; while the lamp is on, the neutral can too.',
  hint:['The L end of the meter is the live, the N end is the neutral.','The live goes to the switch, and from the switch to the lamp.','The other end of the lamp connects to the neutral (N).']},
 9:{name:'Wire colours',who:'Homeowner',
  say:"So the next electrician doesn't get confused, every wire should be its own colour. Two lamps in the living room.",
  learn:'The live is run in {L1}, the neutral in {notr}.',more:"Pick the colour in the Wire tray, then draw. To change a drawn wire's colour, tap it once, then pick the new colour. On the sheet wires are drawn plain; the ring at each end shows the colour. When the power is on, the real colours show.",
  hint:['Pick {L1} in the Wire tray and draw from the live (L) to the top ends of both lamps.','Pick {notr} and draw from the bottom ends of the lamps to the neutral (N).','Tap a wire drawn in the wrong colour once, then pick the right colour.']},
 10:{name:'Tester pen',who:'Old building',
  say:"Both wires are black, we don't know which is live. Connect the lamp. Careful, the power is on!",
  learn:'The tester pen lights up on the live and stays dark on the neutral.',more:'Pick the pen in the Test tray and try both ends in the junction box. When you find the live, switch off. Then run {L1} to the live and {notr} to the neutral.',
  hint:['Pick the pen in the Test tray and touch the two ends in the junction box one after the other. The end where the pen lights is the live.','Switch off. If you touch a wire while the power is on, you get a shock.','Run {L1} from the live to the lamp, and {notr} from the lamp to the other end.']},
 11:{name:'Thunderstruck',topic:'The switch goes on the live',who:'Homeowner',
  say:'I changed the bulb with the lamp off and still got a shock!',
  learn:'A switch always goes on the live. If it is put on the neutral, the lamp can shock you even when it is off.',more:'The live goes to the switch first, then from the switch to the lamp; this wire is {L1} too. The neutral comes straight to the lamp. Test with the pen: with the lamp off, touch the ends of the lamp.',
  hint:['In this drawing the live goes straight to the lamp and the switch is on the neutral. Remove all three wires.','Connect the live (L) to one end of the switch and the other end of the switch to one end of the lamp. Both are {L1}.','Connect the other end of the lamp to the neutral (N) with a {notr} wire.']},
 12:{name:'One switch, two lamps',who:'Homeowner',
  say:'A long hallway. Two lamps should come on together with one switch.',
  learn:'After the switch the live splits in two and lights both lamps together.',more:'The lamps are wired in parallel and share the neutral.',
  hint:['Live (L) to the switch.','From the switch output to the top ends of both lamps. For the second one you can branch off the wire.','The bottom ends of both lamps to the neutral (N).']},
 13:{name:'Two switches, two lamps',who:'Homeowner',
  say:"The kitchen and bathroom lights should work separately, each with its own switch. The column in between can't be drilled; take the wire around it.",
  learn:'Each lamp lights with its own switch.',more:'The live splits in two: one goes to the first switch, the other to the second. The neutral is shared by both lamps.',
  hint:['From the live (L) to the inputs of both switches.','Each switch output to its own lamp.','The bottom ends of both lamps to the neutral (N).']},
 14:{name:'Two Faced',topic:'Double switch',who:'Living room',
  say:'With one switch I want to light half of the chandelier, or all of it.',
  learn:'A double switch has two rockers: the left one switches output 1, the right one output 2.',more:'It has one input (L) and two outputs (1 and 2). The live comes to the input. It is used to light the two groups of a chandelier separately.',
  hint:['Live to the L end of the double switch.','Output 1 to one lamp, output 2 to the other.','The bottom ends of the lamps to the neutral (N).']},
 15:{name:'Two-way switches work in pairs',who:'Bedroom',
  say:'The lamp should switch on and off both from the door and from the bed. The two-way switch by the door is already in.',
  learn:'Two-way switches always work in pairs: the lamp switches from two places.',more:'It has three ends: common (C), 1 and 2. Electricity coming in at C goes either to 1 or to 2. Connect the 1 ends of the two switches together, and the 2 ends together. The one by the door is in; you add the second one and connect it.',
  hint:['Drag the second two-way switch from the Parts tray onto the sheet.','Connect the 1 ends of the two switches together, and the 2 ends together.','The common end (C) of the second switch goes to the top end of the lamp.']},
 16:{name:'Stairway to Heaven',topic:'Stair light: two two-way switches',who:'Duplex house',
  say:'I want to switch it on at the bottom of the stairs and off at the top. And the other way round.',
  learn:'With two two-way switches the stair light works from two places.',more:'The live goes into the common end (C) of the first switch. The 1 ends of both switches are connected together, and the 2 ends together. The common end of the second switch goes to the lamp.',
  hint:['Live to the common end (C) of the first two-way switch.','Connect the 1 ends of both switches together, and the 2 ends together.','The common end of the second switch to the lamp, the other end of the lamp to the neutral.']},
 17:{name:'Switching from three places',who:'Duplex house',
  say:'The stairs go up three floors. I want to switch the lamp from each floor.',
  learn:'For a third place, an intermediate switch goes between the two two-way switches.',more:'The top two ends of the intermediate switch come from the first two-way switch, the bottom two go to the second. Flipping it connects the two wires straight or crossed.',
  hint:['Live to the common end (C) of the first two-way switch.','The 1 and 2 ends of the first two-way switch go to the top two ends of the intermediate switch (1 and 2).','The bottom two ends of the intermediate switch (3 and 4) go to the 1 and 2 ends of the second two-way switch. Its common end goes to the lamp, the other end of the lamp to the neutral.']},
 18:{name:'Doorbell',who:'Homeowner',
  say:"The doorbell doesn't ring, wire it again. It should ring while the button is pressed and stop when it is released.",
  learn:'A bell button closes the path while pressed and opens it when released.',more:'A bell is a load with two ends, like a lamp. Put the button on the path of the live. Switch on and hold the button to test.',
  hint:['Live (L) to the button.','The other end of the button to the bell.','The other end of the bell to the neutral (N).']},
 19:{name:'Multimeter: is there power?',who:'Building manager',
  say:'One of the three sockets works, check the others. Careful, the power is on!',
  learn:'A multimeter shows the voltage between two points as a number. Between live and neutral it is {V} V.',more:'If the number is zero, there is no voltage between those two points. Pick the multimeter in the Test tray and touch the L end of a socket, then its N end. When you find the cause, switch off and run the missing wire.',
  hint:['Pick the multimeter. Touch the L end of the first socket, then its N end: it shows {V} V.','Measure the second socket too. If you see zero, no power reaches that socket.','A wire is missing from the neutral (N) of the first socket to the neutral of the second. Switch off, run the wire, switch on and measure again.'],
  outro:'Where the multimeter showed zero there was no power: the neutral had been left unfinished. The pen only says yes or no; the multimeter also tells you how much.'},
 20:{name:'Is There Anybody In There?',topic:'Multimeter: broken wire',who:'Homeowner',
  say:"The lamp won't light, and I just bought the bulb. The wires look fine too.",
  learn:'With the power off, the multimeter beeps if there is a path between two points.',more:'No beep means there is a break in between. A broken wire looks fine from the outside. Pick the multimeter in the Test tray and touch the two ends of a wire one after the other.',
  hint:['Pick the multimeter. The power must be off.','Measure both ends of each wire. If you hear no beep, that wire is broken.','Tap the broken wire twice to remove it, and run a new one.'],
  outro:'The wire was broken inside, though it looked fine from the outside. No beep with the power off tells you a wire is broken.'},
 21:{name:'Who You Gonna Call?',topic:'First fault call',who:'Building manager',
  say:"The lamp in square C3 won't light. The other two work.",
  learn:'A fault location is given by the letter and number on the edge: C3 is row C, column 3.',more:'Letters run top to bottom, numbers left to right. Tap a part and its square shows at the bottom. Find the part in that square first, then check its path with the multimeter.',
  hint:['Tap parts: the square name shows at the bottom. Find the lamp in square C3.',"With the power off, measure the wire from that lamp's switch to the lamp with the multimeter.",'If there is no beep, that is the broken wire. Remove it and run a new one.'],
  outro:'You found the fault and fixed it. The fault calls on the home screen come like this too: the place is given as a letter and a number, and you find it.'},
 22:{name:'Breaker',who:'Homeowner',
  say:"Last month the lamp wire burned. Never again: put a breaker on the live's path.",
  learn:"A breaker cuts the path when too much current flows, so the wire doesn't burn. It goes on the live.",more:'The live goes through the breaker first, then to the lamp. This sheet comes with a short circuit on purpose: switch on and watch the breaker trip. Then remove the extra wire and tap the breaker to switch it back on.',
  hint:['Drag the breaker from the Parts tray onto the sheet and pick {A10} A as its value.','Live (L) to the top end of the breaker, the bottom end of the breaker to the lamp.','Switch on: the breaker trips. Remove the wire that skips the lamp, tap the breaker to switch it back on, and try again.'],
  outro:'The breaker tripped and cut only that circuit. Without it the wire could have heated up and burned.'},
 23:{name:'The breaker goes on the live',who:'Homeowner',
  say:'The breaker had tripped, and I still got a shock changing the bulb!',
  learn:'Like a switch, a breaker goes on the live.',more:'If it is fitted on the neutral, the lamp goes off when it trips, but the live still reaches the lamp; whoever changes the bulb gets a shock. Right now the breaker is on the neutral. Remove the wires and run them to the right places.',
  hint:['Remove all three wires.','Live (L) to the top end of the breaker, the bottom end of the breaker to the lamp.','The other end of the lamp goes straight to the neutral (N).']},
 24:{name:'Breaker rating',who:'Homeowner',
  say:'I want a {A10} amp breaker for the lighting circuit.',
  learn:"A breaker's rating is given in amps (A). A lighting circuit usually gets {A10} A.",more:"Pick too small and it trips for nothing; pick too big and it doesn't protect. When you put the breaker on the sheet, pick its value from the list that opens.",
  hint:['When you drop the breaker on the sheet the value list opens. Pick {A10} A.','Live to the top end of the breaker, the bottom end to the lamp.','The other end of the lamp to the neutral (N).']},
 25:{name:'Socket',who:'Homeowner',
  say:'A socket next to the bed.',
  learn:'A socket is not connected to a switch; it is always powered.',more:"It has three holes: live (L), neutral (N) and earth (PE). The earth is already wired; you'll learn what it is for two sheets from now. You connect the live and the neutral.",
  hint:['Live (L) to the L end of the socket.','Neutral (N) to the N end of the socket.']},
 26:{name:'Lighting circuit, socket circuit',who:'Homeowner',
  say:"When the oven trips the breaker, the whole house goes dark. The concrete column in the middle can't be drilled.",
  learn:'Lights and sockets are fed by separate circuits: a {A10} A breaker for the lights, {A16} A for the sockets.',more:"That way a fault at a socket doesn't turn off the lights. To share the live between the two breakers, you can branch off a wire.",
  hint:['Put both breakers on the sheet. Pick {A10} A for the left one and {A16} A for the right one.','Live to the top of the first breaker, and from there to the lamp.','Branch off the same live to the second breaker, and from there to the socket.','Connect the neutrals of the lamp and the socket to the neutral.']},
 27:{name:'Earth wire',who:'Homeowner',
  say:'My hand tingles when I touch the washing machine.',
  learn:'Electricity leaking to a metal body must go to earth, not through a person.',more:"The earth end (PE) of the socket is connected to the supply earth with a {toprak} wire. The earth wire normally carries no current. Live and neutral are done; you run the earth.",
  hint:['Pick {toprak} in the Wire tray.','Draw from the PE end of the socket to the PE end of the supply.']},
 28:{name:'What the earth wire is not',who:'Homeowner',
  say:'The last electrician mixed something up, could you check?',
  learn:'A lamp is not connected to earth, and neutral and earth are not joined.',more:"The earth wire is for protection; the lamp's way back is the neutral. There are two wrong connections in the drawing. Find them, remove them, and connect the lamp to the neutral.",
  hint:['A wire joins the neutral and the earth: remove it.','The bottom end of the lamp goes to earth: remove that too.','Connect the bottom end of the lamp to the neutral (N).']},
 29:{name:'RCD',who:'Homeowner',
  say:'There are kids in the house; I want peace of mind.',
  learn:'An RCD cuts the power at once if electricity leaks through a person. Both live and neutral go through it.',more:'Put the RCD between the supply and the socket: live and neutral go in at the top ends and come out of the bottom ends to the socket. To protect people, pick {mA30} mA.',
  hint:['Put the RCD on the sheet and pick {mA30} mA.','Live and neutral come to the two top ends of the RCD.','From the bottom ends of the RCD, the live goes to the L end of the socket and the neutral to N.']},
 30:{name:'Why did the RCD trip?',who:'Homeowner',
  say:'I switch it on and it drops straight back.',
  learn:'If the RCD trips, electricity is leaking somewhere. The most common cause is neutral joined to earth.',more:'Switch on, and when the RCD trips, read the reason it gives. Find the wrong connection and remove it, then tap the RCD to switch it back on.',
  hint:['Switch on. When the RCD trips, read the reason.','Remove the wire from the bottom of the RCD to earth.','Tap the RCD to switch it back on.']},
 31:{name:'Main switch',who:'Homeowner',
  say:'When we go on holiday I want to switch everything off in one place.',
  learn:'The main switch cuts all the power in the house in one go.',more:'It comes right after the supply; both live and neutral go through it. Feed the lamp and the socket from below it.',
  hint:['Put the main switch on the sheet.','Live and neutral come from the supply to the top ends of the main switch.','From the bottom ends of the main switch, feed the lamp and the socket.']},
 32:{name:'Small panel',who:'Homeowner',
  say:'Build the panel from scratch.',
  learn:'Panel order: main switch, RCD, breakers.',more:'The lighting and socket circuits come last. The main switch cuts everything, the RCD protects every circuit, the breakers keep the circuits apart.',
  hint:['Put all four parts down: main switch, RCD, two breakers. RCD {mA30} mA, breakers {A10} A and {A16} A.','Live and neutral: supply, main switch, RCD, in that order.','From the bottom live end of the RCD, branch to the two breakers. The breakers go to the lamp and the socket.','From the bottom neutral end of the RCD, to the lamp and the socket.']},
 33:{name:'One room',who:'Homeowner',
  say:"The whole bedroom: a switched ceiling lamp and two sockets. There's no panel either; build that too.",
  learn:"Put together what you've learned: panel, lamp, two sockets.",more:'Panel order: main switch, RCD, breakers. {A10} A for the lamp, {A16} A for the sockets. The switch goes on the live. The earth is already wired.',
  hint:['Put down the main switch, the RCD ({mA30} mA), two breakers ({A10} A and {A16} A) and the switch.','Build the panel in order: supply, main switch, RCD, breakers.','From the lighting breaker, the live goes to the switch, and from the switch to the lamp.','From the socket breaker, give the live to both sockets. Connect the neutrals too.']},
 34:{name:'Home Sweet Home',topic:'The whole house',who:'Architect',
  say:'A turnkey flat. The panel is ready.',
  learn:'The exam of this part: the whole house.',more:'The panel is ready; you connect the loads to the breakers. Chandelier: the left rocker of the double switch lights E1, the right one E2. The hallway lamp E3 works with two two-way switches. Two sockets in the kitchen.',
  hint:['From the first breaker to the double switch: the live to its L end, ends 1 and 2 to the two chandelier lamps.','From the second breaker, the hallway: to the C end of the first two-way switch, 1 to 1 and 2 to 2 between the two switches, the C end of the second switch to the lamp.','The third breaker goes to the two sockets. Connect all the neutrals to the bottom neutral end of the RCD.']},
 35:{name:'Three phases',who:'Building manager',
  say:'All three flats are on the same phase.',
  learn:'Three phases come into a building. The flats are shared out over the three phases.',more:'The phases are the {L1}, {L2} and {L3} wires; a home usually uses one of them. If everything is loaded on one phase, that line is overworked. Right now all three flats are on the first phase: move the second to L2 and the third to L3.',
  hint:['Remove the top wires of the second and third flats that go to L1.','Connect the second flat to L2 and the third to L3.','Wire colours in order: L1 {L1}, L2 {L2}, L3 {L3}.']},
 36:{name:'Between two phases',who:'Workshop foreman',
  say:'The bulb I fitted blew. Careful, the power is on!',
  learn:'There are {V3} V between two phases. A bulb connected there blows.',more:'Bulbs are made for live to neutral ({V} V). Touch the two phases with the multimeter one after the other and see. Then switch off and move the lamp between a phase and the neutral.',
  hint:['Touch L1 and L2 with the multimeter: {V3} V.',"Switch off. Remove the lamp's wire that goes to L2.",'Connect the bottom end of the lamp to the neutral (N).']},
 37:{name:'Three-pole breaker',who:'Workshop foreman',
  say:'Three lamps for the workshop: three separate phases, one breaker.',
  learn:'A three-pole breaker cuts all three phases together: if one trips, all three open.',more:'Run the three phases through the three-pole breaker, then give each phase to one lamp. Pick {A16} A.',
  hint:['Put the three-pole breaker on the sheet and pick {A16} A.','L1, L2, L3 come to the three top ends of the breaker (1, 3, 5).','The bottom ends (2, 4, 6) go to the three lamps. The bottom ends of the lamps connect to the neutral.']},
 38:{name:'I Like to Move It',topic:'Motor',who:'Workshop foreman',
  say:'The ventilation fan should run.',
  learn:'A three-phase motor turns when three separate phases reach its U, V, W ends.',more:'L1, L2, L3 go to U, V, W. Feed the motor from below the three-pole breaker: switching the breaker on starts it, switching it off stops it.',
  hint:['Put the three-pole breaker down and pick {A16} A.','L1, L2, L3 to the top ends of the breaker.','The bottom ends of the breaker go to U, V, W of the motor in order.']},
 39:{name:"The motor's earth",who:'Workshop foreman',
  say:'The apprentice got a shock touching the fan.',
  learn:'The metal body of the motor is earthed too.',more:'The PE end of the motor goes to the supply earth with a {toprak} wire. The power connections are done; you run the earth.',
  hint:['Pick {toprak} in the Wire tray.','Draw from the PE end under the motor to the PE end of the supply.']},
 40:{name:'You Spin Me Round',topic:'Direction of rotation',who:'Workshop foreman',
  say:'The fan blows air in; it should blow it out. Careful, the power is on!',
  learn:'Swap two phases and the motor turns the other way.',more:'If L1, L2, L3 reach U, V, W in that order, the motor turns forward. Right now it turns backwards: switch off and move two wires to the right ends.',
  hint:['The two wires from ends 4 and 6 of the breaker to the motor are swapped.','Switch off and remove both.','End 4 goes to V, end 6 goes to W.']},
 41:{name:'Contactor',who:'Workshop foreman',
  say:'I want a lamp I can switch on from a distance.',
  learn:'A contactor is a big switch worked by electricity: when its coil gets power, it pulls in.',more:'Coil (A1-A2): the live goes through the switch to A1, A2 goes to the neutral. Lamp: the live comes to end 1 of the contactor, and goes from end 2 to the lamp.',
  hint:['Put the switch on the sheet.','Coil: live to the L end of the switch, end 1 of the switch to A1 of the contactor, A2 to the neutral.','Lamp: live to end 1 of the contactor, end 2 to the lamp, the other end of the lamp to the neutral.']},
 42:{name:'Motor with a contactor',who:'Workshop foreman',
  say:"Let's start and stop the fan with a switch somewhere else.",
  learn:'The small switch pulls in the contactor, the contactor runs the motor.',more:"The motor's path is the power circuit, the coil's path is the control circuit. Take the control live from below the three-pole breaker (end 2): switching the breaker off stops everything. Connect the bottom ends of the contactor to the motor, then feed the coil through the switch.",
  hint:['Connect ends 2, 4, 6 of the contactor to U, V, W of the motor.','Put the switch down. From end 2 of the three-pole breaker to the L end of the switch, end 1 of the switch to A1 of the coil.','A2 of the coil to the neutral.']},
 43:{name:'Start button',who:'Workshop foreman',
  say:'The crane should run only while the button is held.',
  learn:'The Start button closes the path while pressed: the motor turns only while it is held.',more:"The power circuit is done. Put the button on the coil's path.",
  hint:['Put the Start button on the sheet.','From end 2 of the three-pole breaker to end 13 of the button, end 14 to A1 of the coil.']},
 44:{name:'Stop button',who:'Workshop foreman',
  say:'I need a warning lamp that goes off when a button is pressed.',
  learn:'The Stop button normally keeps the path closed and opens it when pressed.',more:'The live goes in at end 11 of Stop and out of end 12 to the lamp.',
  hint:['Put the Stop button on the sheet.','Live to end 11 of Stop, end 12 to the lamp, the other end of the lamp to the neutral.']},
 45:{name:"Can't Stop",topic:'Holding on',who:'Workshop foreman',
  say:'Press and let go, and it should keep running.',
  learn:"So the motor doesn't stop when Start is released, the contactor's 13-14 contact is wired in parallel with Start. This is called a holding contact.",more:'When the contactor pulls in, this contact closes and feeds the coil itself. There is no Stop yet; you can stop the motor with the three-pole breaker. End 13 of Start to end 13 of the contact, end 14 of the contact to A1 of the coil.',
  hint:['Connect end 13 of Start to end 13 of the contactor.','Connect end 14 of the contactor to A1 of the coil.','Press Start and let go: the motor keeps turning.']},
 46:{name:'Start-stop',who:'Workshop foreman',
  say:'One button starts it, the other one stops it.',
  learn:'Stop goes at the head of the control path: before both Start and the holding contact.',more:'The live goes in at end 11 of Stop first, and from end 12 it splits to Start and to the holding contact. Right now the live goes straight there from the breaker: remove those wires.',
  hint:['Remove the two wires from the breaker to end 13 of Start and to end 13 of the contactor.','Put Stop down. From end 2 of the three-pole breaker to end 11 of Stop.','From end 12 of Stop to end 13 of Start and to end 13 of the contactor.']},
 47:{name:'Overload relay',who:'Workshop foreman',
  say:'The motor burned out last week. It must not happen again.',
  learn:'An overload relay notices when a struggling motor heats up. It goes between the contactor and the motor.',more:'Ends 2-4-6 of the contactor go to ends 1-3-5 of the overload relay, and ends 2-4-6 of the relay go to the motor. The relay is already set. Right now the motor is connected straight to the contactor: remove those wires.',
  hint:['Remove the three wires from the contactor to the motor.','Connect ends 2, 4, 6 of the contactor to ends 1, 3, 5 of the overload relay.','Connect ends 2, 4, 6 of the overload relay to U, V, W of the motor.']},
 48:{name:'The overload contact',who:'Workshop foreman',
  say:"The overload relay tripped, but the motor didn't stop!",
  learn:'When the overload relay trips, its 95-96 contact opens and stops the motor. This contact goes in series with Stop.',more:"Right now end 12 of Stop goes straight to Start and to the holding contact. Remove those wires and put the relay's 95-96 contact in between.",
  hint:['Remove the two wires from end 12 of Stop to Start and to the contactor.','Connect end 12 of Stop to end 95 of the overload relay.','Connect end 96 of the relay to end 13 of Start and to end 13 of the contactor.']},
 49:{name:'Overload setting',who:'Workshop foreman',
  say:"The overload relay either trips for nothing or never trips. The motor's label says 5.2 A.",
  learn:'The overload relay is set to the range that covers the current on the motor label.',more:"Pick too small and it trips for nothing; too big and it doesn't protect. Label: 5.2 A. Tap the relay and pick from the list.",
  hint:['Tap the overload relay.','Which range covers 5.2 A? 4-6 A.']},
 50:{name:'Blinding Lights',topic:'Signal lamps',who:'Workshop foreman',
  say:'A green lamp should light while the motor runs, and a red one when there is a fault.',
  learn:'The green lamp lights while the motor runs, the red one when the overload relay trips.',more:"The green lamp is wired in parallel with the coil (between A1 and the neutral). The relay's 97-98 contact closes when it trips: the live (from end 2 of the three-pole breaker) goes in at 97 and from 98 to the red lamp.",
  hint:['Green lamp (E1): top end to A1 of the contactor, bottom end to the neutral.','Red lamp (E2): from end 2 of the three-pole breaker to end 97 of the overload relay, end 98 to the red lamp, the other end of the lamp to the neutral.']},
 51:{name:'Control from two places',who:'Workshop foreman',
  say:'The conveyor should start and stop from both ends.',
  learn:'Two Starts in parallel, two Stops one after the other.',more:"That way any Start starts it and any Stop stops it. The power circuit is done. The live goes through the Stops and the overload relay's 95-96 contact, then splits to both Starts and the holding contact.",
  hint:['From end 2 of the three-pole breaker to end 11 of the first Stop, and from end 12 of the first Stop to end 11 of the second Stop.','End 12 of the second Stop to end 95 of the overload relay. End 96 to end 13 of both Starts and to end 13 of the contactor.','End 14 of both Starts and end 14 of the contactor to A1 of the coil.']},
 52:{name:'Open Sesame',topic:'Forward-reverse',who:'Workshop foreman',
  say:'The garage door should open and close.',
  learn:'To turn a motor both ways, two contactors are used: one gives the phases straight, the other swaps two of them.',more:'The switch starts and stops the motor, the two-way switch picks the direction. Connect the contactor outputs to the overload relay.',
  hint:['Ends 2, 4, 6 of the first contactor to ends 1, 3, 5 of the overload relay, in order.','End 2 of the second contactor to end 1 of the relay, end 4 to 5, end 6 to 3: two phases swap.','Switch on, flip the two-way switch and try both directions.']},
 53:{name:'Interlock',who:'Workshop foreman',
  say:'Pressing both buttons at once blew up the panel.',
  learn:'If both contactors pull in at the same time, there is a short circuit. Each one locks the other out.',more:"The 21-22 contact is normally closed and opens when the contactor pulls in. First remove the wires going to the coils, then feed each coil through the other contactor's 21-22 contact.",

const ORIG={T:{},LV:{}};

function localize(){
  const us=REG&&REG.words;
  for(const k in T){const o=ORIG.T[k]||(ORIG.T[k]={name:T[k].name,info:T[k].info});
    const en=LANG==='en'?PART_EN[k]||{}:{},u=us?(PART_US[k]||{})[LANG]||{}:{};
    T[k].name=u.name||en.name||o.name;T[k].info=u.info||en.info||o.info;
    if(us&&LANG==='en'){T[k].name=usWords(T[k].name);T[k].info=usWords(T[k].info)}}
  for(const d of LEVELS){
    const o=ORIG.LV[d.id]||(ORIG.LV[d.id]=Object.fromEntries(LV_TEXT.concat(LV_LOGIC).filter(f=>f in d).map(f=>[f,d[f]])));
    for(const f of LV_TEXT.concat(LV_LOGIC))if(f in o)d[f]=o[f];else delete d[f];
    if(LANG==='en')Object.assign(d,LV_EN[d.id]||{});
    if(us){const u=LV_US[d.id]||{};Object.assign(d,u.def||{},u[LANG]||{});
      if(LANG==='en')for(const f of LV_TEXT)if(d[f])d[f]=Array.isArray(d[f])?d[f].map(usWords):usWords(d[f])}
    delete d._reel;
  }
}

/* ---------- circuit ---------- */
function termsOf(c){return T[c.type].terms(c).map(([id,dx,dy,s,lab])=>{const [px,py]=rotPt(c,dx,dy);return {key:c.id+'.'+id,id,lab:lab||id,c,x:c.x+px,y:c.y+py,s:rotSide(s,c.r)}})}
function rebuildTerms(){TERMS=cur.comps.flatMap(termsOf);TMAP=Object.fromEntries(TERMS.map(t=>[t.key,t]))}
function UF(){const p=new Map();const f=k=>{if(!p.has(k))p.set(k,k);let r=k;while(p.get(r)!==r)r=p.get(r);while(p.get(k)!==r){const n=p.get(k);p.set(k,r);k=n}return r};return{find:f,union:(a,b)=>{const x=f(a),y=f(b);if(x!==y)p.set(x,y)}}}
function inner(c){
  const s=c.st||{};
  switch(c.type){
    case 'mcb':return s.on&&!s.trip?[['1','2']]:[];
    case 'mcb3':return s.on&&!s.trip?[['1','2'],['3','4'],['5','6']]:[];
    case 'rcd':return s.on&&!s.trip?[['1','2'],['N','N2']]:[];
    case 'msw':return s.on||REG.mainN?(s.on?[['1','2'],['N','N2']]:[['N','N2']]):[];
    case 'switch1':return s.on?[['L','1']]:[];
    case 'komut':return [].concat(s.a?[['L','1']]:[],s.b?[['L','2']]:[]);
    case 'vavien':return [['C',s.p?'2':'1']];
    case 'kruvaze':return s.p?[['1','4'],['2','3']]:[['1','3'],['2','4']];
    case 'buton':return s.pr?[['1','2']]:[];
    case 'stop':return s.pr?[]:[['11','12']];
    case 'start':return s.pr?[['13','14']]:[];
    case 'contactor':return s.en?[['1','2'],['3','4'],['5','6'],['13','14']]:[['21','22']];
    case 'thermal':return [['1','2'],['3','4'],['5','6']].concat(s.trip?[['97','98']]:[['95','96']]);
  }
  return [];
}
/* paths a phase keeps its name through (used for wire colors) */
const PASS={msw:[['1','2'],['N','N2']],mcb:[['1','2']],mcb3:[['1','2'],['3','4'],['5','6']],rcd:[['1','2'],['N','N2']],contactor:[['1','2'],['3','4'],['5','6']],thermal:[['1','2'],['3','4'],['5','6']]};
function nets(opt={}){
  const u=UF();
  for(const w of cur.wires)if(!w.cut)u.union(w.a,w.b);
  for(const c of cur.comps){
    if(opt.open&&opt.open.has(c))continue;
    for(const [a,b] of (opt.color?(PASS[c.type]||[]):inner(c)))u.union(c.id+'.'+a,c.id+'.'+b);
  }
  const sc=cur.src,m=T[sc.type].src(sc),f=k=>m[k]?u.find(sc.id+'.'+m[k]):null;
  const ph={};for(const k of ['L1','L2','L3']){const v=f(k);if(v!==null)ph[k]=v}
  const N=f('N'),PE=f('PE'),pl=Object.values(ph),lines=pl.concat(N!==null?[N]:[]);
  const short=new Set(lines).size<lines.length||(PE!==null&&pl.includes(PE));
  const role=x=>{for(const k in ph)if(ph[k]===x)return k;return null};
  return {u,ph,pv:new Set(pl),N,PE,short,role};
}
function simulate(power){
  const ks=cur.comps.filter(c=>c.type==='contactor');
  let r;
  for(let i=0;i<12;i++){
    r=nets();let ch=false;
    for(const c of ks){
      const a=r.u.find(c.id+'.A1'),b=r.u.find(c.id+'.A2');
      let en=power&&!r.short&&((r.pv.has(a)&&b===r.N)||(r.pv.has(b)&&a===r.N))?1:0;
      if(c.st.force===0||c.st.force===1)en=c.st.force;
      if(en!==(c.st.en?1:0)){c.st.en=en;ch=true}
    }
    if(!ch)break;
  }
  const on=power&&!r.short,at=(c,t)=>r.u.find(c.id+'.'+t),P=x=>r.pv.has(x);
  const out={short:power&&r.short,on,r,ring:{},lit:{},phase:{},live:{},grounded:{},burn:{},run:{},hum:{},coil:{}};
  for(const c of cur.comps){
    if(c.type==='lamp'){const a=at(c,'a'),b=at(c,'b');
      out.lit[c.id]=on&&!c.st.out&&((P(a)&&(b===r.N||b===r.PE))||(P(b)&&(a===r.N||a===r.PE)));
      out.burn[c.id]=on&&P(a)&&P(b)&&a!==b;out.phase[c.id]=on&&(P(a)||P(b))}
    if(c.type==='zil'){const a=at(c,'a'),b=at(c,'b');out.ring[c.id]=on&&((P(a)&&b===r.N)||(P(b)&&a===r.N));out.phase[c.id]=on&&(P(a)||P(b))}
    if(c.type==='socket'){const l=at(c,'L'),n=at(c,'N');out.live[c.id]=on&&((P(l)&&n===r.N)||(P(n)&&l===r.N));out.grounded[c.id]=r.PE!==null&&at(c,'PE')===r.PE}
    if(c.type==='contactor')out.coil[c.id]=on&&(P(at(c,'A1'))||P(at(c,'A2')));
    if(c.type==='motor3'){
      out.grounded[c.id]=r.PE!==null&&at(c,'PE')===r.PE;
      const ps=['U','V','W'].map(t=>on?r.role(at(c,t)):null),d=new Set(ps.filter(Boolean));
      if(d.size===3)out.run[c.id]=['L1L2L3','L2L3L1','L3L1L2'].includes(ps.join(''))?1:-1;
      else if(d.size===2)out.hum[c.id]=true;
    }
  }
  /* a lamp that is not across phase and neutral but sits on a chain of lamps between them glows dim (series) */
  out.dim={};
  if(on){const ls=cur.comps.filter(c=>c.type==='lamp'&&!c.st.out&&!out.lit[c.id]&&!out.burn[c.id]);
    const reach=(starts,skip)=>{const seen=new Set(starts);for(let ch=true;ch;){ch=false;for(const f of ls){if(f===skip)continue;const x=at(f,'a'),y=at(f,'b');
      if(seen.has(x)&&!seen.has(y)){seen.add(y);ch=true}if(seen.has(y)&&!seen.has(x)){seen.add(x);ch=true}}}return seen};
    for(const e of ls){const x=at(e,'a'),y=at(e,'b');if(x===y||r.N===null)continue;
      const fp=reach([...r.pv],e),fn=reach([r.N],e);
      if((fp.has(x)&&fn.has(y))||(fp.has(y)&&fn.has(x)))out.dim[e.id]=true}}
  return out;
}
/* why a residual current device would trip, or null */
function rcdReason(k,sim){
  const r=nets({open:new Set([k])}),f=t=>r.u.find(k.id+'.'+t);
  const oL=f('2'),oN=f('N2'),iN=f('N');
  if(r.PE!==null&&oN===r.PE)return TL('Rölenin çıkışında nötr ile toprak birleşmiş.');
  if(oN===iN)return TL('Nötr röleyi atlayıp dolaşıyor.');
  const prot=x=>x===oL||x===oN;
  for(const c of cur.comps){
    let a,b;
    if(c.type==='lamp'&&sim.lit[c.id]){a='a';b='b'}else if(c.type==='contactor'&&c.st.en){a='A1';b='A2'}else continue;
    const x=r.u.find(c.id+'.'+a),y=r.u.find(c.id+'.'+b);
    if((prot(x)||prot(y))&&!((x===oL&&y===oN)||(x===oN&&y===oL)))
      return (x===r.PE||y===r.PE)?TL('{0} toprağa bağlanmış, akım topraktan dönüyor.',c.id):TL('{0} üstünden geçen akım röleden geçmeyen bir yoldan dönüyor.',c.id);
  }
  return null;
}

function descRow(ins,s){
  return ins.map(([c,k],i)=>{const v=s[i];
    if(c.type==='switch1')return `${c.id}: ${v?'I':'O'}`;
    if(c.type==='komut')return TL(k==='a'?'{0} sol tuş: {1}':'{0} sağ tuş: {1}',c.id,v?'I':'O');
    return TL('{0}: {1}. konum',c.id,v?'2':'1');
  }).join(', ');
}

/* shortest grid path around parts and other wires; a turn costs 3 steps so paths stay straight */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(u,goal,cd,avoid,relax){
  const W=cur.vb.w/G+1,H=cur.vb.h/G+1,idx=(x,y,d)=>((y/G)*W+(x/G))*4+d,dist=new Map(),from=new Map(),Q=[];

function extend(goal){

  const u=lastP(d.P),q=d.P[d.P.length-2],cd=q?[Math.sign(u[0]-q[0]),Math.sign(u[1]-q[1])]:null;
  const inPart=!termAt(goal)&&!juncAt(goal)&&cur.comps.some(c=>!c.hidden&&inRect(goal,rectOf(c)));
  const path=inPart?null:findPath(u,goal,cd,new Set(d.P.map(p=>p[0]+','+p[1])));

  for(let guard=0;guard<300&&!same(lastP(d.P),goal);guard++){
    const k=d.P.findIndex(p=>same(p,goal));if(k>=0){d.P.length=k+1;break}
    const u=lastP(d.P),dx=goal[0]-u[0],dy=goal[1]-u[1],q=d.P[d.P.length-2];

/* cable reel sheets: the player's wires together may be only so long. One grid square (10 units) is 10 cm. */
const lenOf=P=>P.reduce((a,p,i)=>i?a+Math.abs(p[0]-P[i-1][0])+Math.abs(p[1]-P[i-1][1]):0,0);
const reelUsed=()=>cur.wires.filter(w=>!w.fixed&&w.P).reduce((a,w)=>a+lenOf(w.P),0);
const mt=u=>(u/100).toLocaleString(LOC,{maximumFractionDigits:1});
/* the reel holds the sample solution's cable plus a quarter, rounded up to half a metre */
function reelFor(d){
  if(d._reel)return d._reel;
  const keep=cur;buildLevel(d,'play');applySolution(d,0);rebuildTerms();routeAll();
  d._reel=Math.ceil(reelUsed()*1.25/50)*50;cur=keep;if(cur)rebuildTerms();
  return d._reel;
}
/* path for a wire laid by the game (fixed wires, faults) */
function autoPath(a,b,via){
  const A=nodePos(a),B=nodePos(b);
  startDraw(a,null,A,'x');for(const v of (via||[]))extend(v);extend(B);
  if(!same(lastP(S.draw.P),B)){const p=findPath(A,B,null,new Set(),true);if(p)S.draw.P=[A,...p]}
  const P=S.draw.P;S.draw=null;
  return same(lastP(P),B)?clean(P):[A,B];
}
function routeAll(){for(const w of cur.wires)if(!w.P){w.P=autoPath(w.a,w.b,w.via);delete w.via}}
function tidyJunctions(){
  for(const k of Object.keys(cur.junc)){
    const ws=wiresAt(k);
    if(!ws.length){delete cur.junc[k];continue}
    if(ws.length===2&&ws[0].col===ws[1].col){
      let [x,y]=ws;
      if(x.a===k)x={a:x.b,b:x.a,col:x.col,P:x.P.slice().reverse()};
      if(y.b===k)y={a:y.b,b:y.a,col:y.col,P:y.P.slice().reverse()};
      cur.wires=cur.wires.filter(w=>w!==ws[0]&&w!==ws[1]);delete cur.junc[k];
      if(x.a!==y.b)cur.wires.push({a:x.a,b:y.b,col:x.col,P:clean(x.P.concat(y.P.slice(1)))});
    }
  }
}
function delWire(w){pushUndo();cur.wires=cur.wires.filter(x=>x!==w);tidyJunctions();S.selWire=null;toast(TL('Kablo söküldü.'),1400);update()}

/* ---------- placing parts ---------- */
function newId(type){
  const t=T[type];if(t.single&&!cur.comps.some(c=>c.id===t.pre))return t.pre;
  for(let n=1;;n++)if(!cur.comps.some(c=>c.id===t.pre+n))return t.pre+n;
}
function addComp(type,x,y,val,fixed){
  const c={id:newId(type),type,x,y,st:defSt(type),val:val??null};
  if(fixed)c.fixed=1;
  cur.comps.push(c);return c;
}
function validSpot(type,x,y,self,r){
  const t=dims({type,r}),W=cur.vb.w,H=cur.vb.h;
  if(x<0||y<0||x+t.w>W||y+t.h>H)return false;
  for(const c of cur.comps){if(c===self)continue;const u=dims(c);
    if(x<c.x+u.w+20&&x+t.w+20>c.x&&y<c.y+u.h+20&&y+t.h+20>c.y)return false}
  for(const r of cur.walls)if(x<r.x+r.w+20&&x+t.w+20>r.x&&y<r.y+r.h+20&&y+t.h+20>r.y)return false;
  const box={x:x-1,y:y-1,w:t.w+2,h:t.h+2};
  for(const w of cur.wires)if(w.P)for(let i=0;i<w.P.length-1;i++){const a=w.P[i],b=w.P[i+1];
    if(Math.max(a[0],b[0])>=box.x&&Math.min(a[0],b[0])<=box.x+box.w&&Math.max(a[1],b[1])>=box.y&&Math.min(a[1],b[1])<=box.y+box.h)return false}
  return true;
}
function partsLeft(){
  if(cur.mode!=='play')return [];
  return Object.keys(cur.parts).filter(t=>cur.parts[t]-cur.comps.filter(c=>c.type===t&&!c.fixed).length>0);
}
function placeComp(type,x,y){
  pushUndo();
  const c=addComp(type,x,y,null,0);rebuildTerms();
  sfx.pop();vib(12);S.pop=c.id;setTimeout(()=>{S.pop=null},500);S.sel=c;
  if(!saved.rotTip&&!T[type].vals){saved.rotTip=1;persist();setTimeout(()=>toast(TL('Parçayı döndürmek için köşesindeki oka dokun.'),3000),300)}
  if(!partsLeft().length&&cur.mode==='play'&&S.tab==='parts')S.tab='wire';
  update();
  if(T[type].vals)askValue(c);
}

function wirePath(P,prev){
  let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){
    const a=P[i],b=P[i+1],h=a[1]===b[1],dir=h?Math.sign(b[0]-a[0]):Math.sign(b[1]-a[1]),xs=[];
    for(const Q of prev)for(let j=0;j<Q.length-1;j++){
      const c=Q[j],e=Q[j+1];if(h===(c[1]===e[1]))continue;
      if(h?btw(c[0],a[0],b[0])&&btw(a[1],c[1],e[1]):btw(c[1],a[1],b[1])&&btw(a[0],c[0],e[0]))xs.push(h?c[0]:c[1]);
    }
    xs.sort((m,n)=>(m-n)*dir);
    for(const v of xs){
      const s=h?[v-HOP*dir,a[1]]:[a[0],v-HOP*dir],t=h?[v+HOP*dir,a[1]]:[a[0],v+HOP*dir];
      d+=` L${s[0]} ${s[1]} A${HOP} ${HOP} 0 0 ${dir>0?1:0} ${t[0]} ${t[1]}`;
    }
    d+=` L${b[0]} ${b[1]}`;
  }
  return d;
}
function wireSvg(w,d,hot,sel,c){
  let o=sel?`<path class="wsel" d="${d}"/>`:'';
  o+=`<path class="wo" d="${d}"/>`;
  if(S.power){
    o+=`<path class="wc" d="${d}" style="stroke:${c.hex}"/>`;
    if(c.stripe)o+=`<path class="wc" d="${d}" style="stroke:${c.stripe};stroke-dasharray:5 6"/>`;
    o+=`<path class="wh" d="${d}" transform="translate(-1.2,-1.4)"/>`;
    if(hot)o+=`<path class="flow" d="${d}"/>`;
  }else o+=`<path class="wt" d="${d}"/><path class="wh" d="${d}" transform="translate(-1.2,-1.4)"/>`;

function roomHtml(d){
  const u=HOUSE.find(r=>r.ids.includes(d.id)),seen=saved.roomsLit||[];

  setTimeout(()=>{if(!$('modal').hidden)sfx.lamp()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1000);
  return `<div class="roomlit">${h.svg}<p>${TL('{0} aydınlandı · {1} / {2} oda',TL(u.n),h.lit.length,h.total)}</p></div>`;
}

/* ---------- rewarded ads (AdMob, Android app only) ----------
   The browser version (web demo) keeps a 3-second stand-in and the hint is free. In the app the hint opens only when the player really earned the reward.
   Every build shows Google's test ads except one made with `node tools/build-app.js release live`. */
const IS_APP=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const ADS={unit:'',testUnit:'ca-app-pub-3940256099942544/5224354917'};
const ADS_TEST=true;
const AD=()=>IS_APP&&Capacitor.Plugins&&Capacitor.Plugins.AdMob;
let adsInitP=null,adLoaded=false,adBusy=false,adsPrivacy=false;
const adOpts=()=>({adId:ADS_TEST||!ADS.unit?ADS.testUnit:ADS.unit,isTesting:ADS_TEST});
/* consent first (Google's form, only shown where the law asks for it), then the SDK */
function adsInit(){
  if(adsInitP)return adsInitP;
  const A=AD();if(!A)return Promise.resolve(false);
  adsInitP=(async()=>{
    let ci;
    try{ci=await A.requestConsentInfo();if(ci.isConsentFormAvailable&&ci.status==='REQUIRED')ci=await A.showConsentForm()}
    catch(e){if(!ADS_TEST)throw e;ci={canRequestAds:true}}   // test builds: the consent message may not be set up yet
    adsPrivacy=ci.privacyOptionsRequirementStatus==='REQUIRED';
    if(!ci.canRequestAds)return false;
    await A.initialize();return true;
  })().then(ok=>{if(!ok)adsInitP=null;return ok},()=>{adsInitP=null;return false});
  return adsInitP;
}
/* one ad loaded in advance so the button answers at once */
function adPreload(){const A=AD();if(!A||adLoaded||adBusy)return;adsInit().then(ok=>ok&&A.prepareRewardVideoAd(adOpts())).then(r=>{if(r)adLoaded=true}).catch(()=>{adLoaded=false})}
async function playRewardedAd(){
  const A=AD();if(!A||adBusy)return false;
  adBusy=true;const hs=[];let rewarded=false,shown=false;
  try{
    if(!adLoaded){toast(TL('Reklam yükleniyor…'));if(!await adsInit())throw 0;await A.prepareRewardVideoAd(adOpts())}
    adLoaded=false;
    let finish;const done=new Promise(r=>{finish=r});
    hs.push(await A.addListener('onRewardedVideoAdShowed',()=>{shown=true;$('toast').hidden=true;stopMusic()}));
    hs.push(await A.addListener('onRewardedVideoAdReward',()=>{rewarded=true}));
    hs.push(await A.addListener('onRewardedVideoAdDismissed',()=>finish()));
    hs.push(await A.addListener('onRewardedVideoAdFailedToShow',()=>finish()));
    A.showRewardVideoAd().then(()=>{rewarded=true},()=>finish());
    await Promise.race([done,new Promise(r=>setTimeout(r,300000))]);   // never hang
  }catch(e){}
  hs.forEach(h=>{try{h.remove()}catch(e){}});
  adBusy=false;setTimeout(adPreload,500);
  if(shown&&!saved.nomusic)startMusic();
  if(!rewarded)toast(shown?TL('İpucu için reklamın sonuna kadar izlemen gerek.'):TL('Şu an reklam yok. Biraz sonra yine dene.'));
  return rewarded;
}
function showAd(cb){
  if(IS_APP){closeModal();playRewardedAd().then(ok=>{if(ok)cb()});return}
  let n=3;
  const tick=()=>{if($('modal').hidden&&n<3)return;
    if(n===0){closeModal();cb();return}
    modal(`<h2>${TL('Reklam')}</h2><div class="adbox">${TL('Buraya reklam gelecek. Web sürümünde ipucu bedava.')}<b>${n}</b></div><div class="mbtns"><button data-a="close">${TL('Vazgeç')}</button></div>`);n--;setTimeout(tick,1000)};

}
